name: Release

# Dispara ao empurrar uma tag de versao (`git tag v0.2.0 && git push --tags`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # necessario para criar a release e subir o .app

jobs:
  build-macos:
    # Runner arm64: o .app so roda na arquitetura em que foi montado, e o
    # PyInstaller nao faz cross-build. macos-latest ja e Apple Silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Mesmo pin exato da CI, pelo mesmo motivo: setup-uv parou de publicar
      # tags de major a partir da v8.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Precisa existir no PATH da maquina de build: o spec embute os dois
      # binarios no bundle (o app aberto pelo Finder nao ve /opt/homebrew/bin).
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install dependencies
        run: uv sync --extra dev --extra audio --extra build

      - name: Lint (ruff)
        run: uv run ruff check .

      # A suite roda aqui tambem, com o extra `audio` que a CI normal nao
      # instala -- e a unica passagem que exercita o QtAudioPlayer real.
      - name: Test (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

      - name: Build .app
        run: uv run pyinstaller packaging/trackclassifier.spec --noconfirm

      # Smoke test do que acabou de ser montado. `env -i` derruba o PATH para
      # o mesmo minimo que o Finder da: e assim que uma regressao no ffmpeg
      # embutido aparece aqui em vez de so na primeira track da maquina do
      # usuario. Os dois passos cobrem coisas diferentes -- o executavel sobe,
      # e o ffmpeg do bundle roda com as dylibs reescritas pelo PyInstaller.
      - name: Smoke test do bundle
        run: |
          set -euo pipefail
          MINIMO="/usr/bin:/bin:/usr/sbin:/sbin"
          env -i HOME="$HOME" PATH="$MINIMO" \
            dist/TrackClassifier.app/Contents/MacOS/TrackClassifier --help
          env -i HOME="$HOME" PATH="$MINIMO" \
            dist/TrackClassifier.app/Contents/Frameworks/ffmpeg -version
          env -i HOME="$HOME" PATH="$MINIMO" \
            dist/TrackClassifier.app/Contents/Frameworks/ffprobe -version

      # zip preserva o bit de executavel e a estrutura do bundle; um .app
      # solto como artifact do Actions chegaria quebrado.
      - name: Compacta o .app
        run: ditto -c -k --keepParent dist/TrackClassifier.app TrackClassifier-macos-arm64.zip

      - name: Publica a release
        uses: softprops/action-gh-release@v2
        with:
          files: TrackClassifier-macos-arm64.zip
          generate_release_notes: true

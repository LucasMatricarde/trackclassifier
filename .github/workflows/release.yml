name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Ensaio do release: roda os builds inteiros (web, PyInstaller, Electron,
  # smoke do artefato) e sobe os zips como artefato do run, SEM criar tag nem
  # release. E a unica forma de testar este workflow sem queimar um numero de
  # versao -- ele so se exercita de verdade rodando.
  workflow_dispatch:
  # O GitHub so deixa disparar workflow_dispatch de um workflow que ja esta na
  # branch padrao, entao a PRIMEIRA mudanca de empacotamento nao se ensaiaria
  # antes do merge. Num PR que mexe no EMPACOTAMENTO (este arquivo, packaging/
  # ou shell/) o ensaio roda sozinho, e continua valendo como guarda depois.
  # Mudar so web/ ou src/ nao dispara: cada ensaio custa dois runners
  # (macOS e Windows), e o CI normal ja cobre esse codigo; um build quebrado
  # por la so apareceria no push para a main, e por isso o ensaio manual
  # (workflow_dispatch) existe para rodar antes de um bump.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "shell/**"

# gh release create precisa escrever no repositorio; o token padrao vem
# somente-leitura desde 2023. O job determine-tag tambem usa esse escopo pra
# criar/empurrar a tag.
permissions:
  contents: write

jobs:
  # Push em main e push de tag v* caem aqui. Se veio de tag, so repassa. Se
  # veio de main, cria a tag na hora se __version__ mudou -- e pula tudo (sem
  # nem acordar o runner macOS) se nao mudou. Fica num job so, e nao em dois
  # workflows encadeados por push de tag, porque um push feito com
  # GITHUB_TOKEN nao dispara outro `on: push` -- ficaria tag criada e nenhum
  # build rodando atras dela.
  determine-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      should_release: ${{ steps.tag.outputs.should_release }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide a tag do release
        id: tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # Ensaio: devolve a tag que SERIA criada, mas nao cria nem empurra.
            versao=$(grep -oP '(?<=__version__ = ")[^"]+' src/trackclassifier/__init__.py)
            echo "tag=v$versao" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dry_run=false" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          versao=$(grep -oP '(?<=__version__ = ")[^"]+' src/trackclassifier/__init__.py)
          tag="v$versao"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag ja existe -- __version__ nao mudou neste push, nada a lancar."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build-app:
    needs: determine-tag
    if: needs.determine-tag.outputs.should_release == 'true'
    # macos-latest e gratuito neste repositorio por ele ser publico -- a nota
    # antiga do README sobre custo de minutos valia para repositorio privado.
    runs-on: macos-latest
    env:
      TAG: ${{ needs.determine-tag.outputs.tag }}
    steps:
      # Sem credenciais gravadas no .git: este job roda codigo do repositorio
      # (npm test, build) tambem no ensaio de PR, e o token do workflow tem
      # `contents: write`. O unico passo que precisa escrever (gh release) recebe
      # o token explicito pelo env, entao nada do que o build executa o enxerga.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: brew install ffmpeg

      # O app distribuido e o shell Electron com o front React, entao o build
      # precisa de Node: web (Vite) e shell (electron-builder).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            shell/package-lock.json

      - name: Install dependencies
        run: uv sync --extra build

      # Falha aqui e melhor que release publicado mentindo a versao: o app
      # se identificaria com um numero e o release anunciaria outro, e a
      # comparacao do updater passaria a mentir em toda checagem.
      - name: Check tag matches __version__
        run: |
          set -euo pipefail
          versao=$(uv run python -c "import trackclassifier; print(trackclassifier.__version__)")
          tag="${TAG#v}"
          if [ "$versao" != "$tag" ]; then
            echo "Tag $TAG nao bate com __version__ = $versao" >&2
            exit 1
          fi
          # O Info.plist do .app do Electron leva a versao do package.json, e e
          # ela que o updater compara com a do release. test_packaging exige o
          # mesmo no CI; aqui a checagem protege o artefato ja na tag.
          shell_versao=$(node -p "require('./shell/package.json').version")
          if [ "$shell_versao" != "$tag" ]; then
            echo "shell/package.json em $shell_versao, mas a tag e $TAG" >&2
            exit 1
          fi
          echo "versao=$versao" >> "$GITHUB_ENV"

      # Antes do PyInstaller: o spec embute web/dist no backend, e um bundle sem
      # o index.html abriria vazio. O `test -f` falha o job em vez de publicar isso.
      - name: Build the web front
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build
          test -f dist/index.html

      - name: Test the shell
        run: |
          set -euo pipefail
          cd shell
          npm ci
          npm test

      - name: Build the backend
        run: uv run pyinstaller packaging/trackclassifier.spec --noconfirm

      # electron-builder --dir: o .app sem zipar. Quem zipa e o passo abaixo
      # (ditto), porque so ele preserva os symlinks do bundle.
      - name: Pack the Electron shell
        run: |
          set -euo pipefail
          cd shell
          npm run pack
          app=$(ls -d out/mac*/TrackClassifier.app | head -1)
          echo "app_path=$PWD/$app" >> "$GITHUB_ENV"

      # Smoke do ARTEFATO, nao do checkout: sobe o .app empacotado, que inicia o
      # backend embutido e confere que a aba renderiza. E o teste que pegaria
      # um release que abre vazio.
      - name: Smoke the packed app
        timeout-minutes: 5
        run: |
          set -euo pipefail
          "$app_path/Contents/MacOS/TrackClassifier" --smoke

      # ditto e nao zip: o zip comum nao preserva os symlinks internos do bundle
      # (o Electron Framework e as libs nativas dentro do backend), e o app
      # chega quebrado do outro lado. ditto nao
      # aceita duas fontes numa chamada so ("Can't archive multiple
      # sources"), entao pra abrir.command sair irmao do .app (sem pasta por
      # volta) precisa juntar os dois numa pasta de staging e arquivar o
      # CONTEUDO dela (sem --keepParent aqui -- e ele que preserva o nome de
      # cada item dentro, e sem ele o "." vazaria como nome no zip). App nao
      # e notarizado (sem conta Developer paga), entao todo download bate no
      # aviso do Gatekeeper; o script tira a quarantine numa tacada so.
      #
      # O sufixo "-macos" no nome do zip NAO e cosmetico: o seletor de asset
      # do updater ate a v0.2.6 pegava o primeiro ".zip" da lista da API, que
      # vem em ordem alfabetica -- e "-windows" ordena antes de ".zip"
      # ("-" e 0x2D, "." e 0x2E), entao o updater antigo baixava o build do
      # Windows no Mac e a instalacao morria em "nao contem um .app". O
      # codigo corrigido so sai no PROXIMO release; este nome e o que faz o
      # updater quebrado ja instalado (0.2.5/0.2.6) acertar o zip do Mac
      # mesmo com o criterio velho, porque "-macos" < "-windows". Sem isto,
      # quem esta nessas versoes so sai do buraco baixando a mao.
      - name: Zip the bundle
        run: |
          set -euo pipefail
          nome="TrackClassifier-${versao}-macos.zip"
          mkdir staging
          ditto "$app_path" staging/TrackClassifier.app
          cp packaging/abrir.command staging/abrir.command
          (cd staging && ditto -c -k . "../$nome")
          shasum -a 256 "$nome" > "${nome}.sha256"
          echo "zip=$nome" >> "$GITHUB_ENV"

      # Copia de nome fixo alem da versionada: o nome com numero de versao
      # muda a cada release, entao nao da pra linkar ele direto do README.
      # Essa copia mantem o mesmo nome sempre, e "releases/latest/download/"
      # sempre resolve pro asset dessa release mais recente. O "-macos" do
      # nome fixo e pelo mesmo motivo do zip versionado (comentario acima).
      - name: Copia com nome fixo pro link "ultima versao"
        run: |
          set -euo pipefail
          cp "$zip" TrackClassifier-latest-macos.zip
          shasum -a 256 TrackClassifier-latest-macos.zip > TrackClassifier-latest-macos.zip.sha256

      - name: Upload the dry-run artifacts
        if: needs.determine-tag.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macos-dry-run
          path: |
            ${{ env.zip }}
            ${{ env.zip }}.sha256
          retention-days: 3

      - name: Publish the release
        if: needs.determine-tag.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "$zip" "${zip}.sha256" \
            TrackClassifier-latest-macos.zip TrackClassifier-latest-macos.zip.sha256 \
            --generate-notes

  # Depende de build-app, e nao so de determine-tag, porque quem CRIA o
  # release e o job do macOS: dois jobs em paralelo chamando `gh release
  # create` na mesma tag dariam corrida (o segundo falha com "release already
  # exists"). Aqui so sobe os assets do Windows no release que ja existe.
  #
  # Sem auto-update no Windows: todo o updates.py e macOS (ditto para
  # restaurar symlink, Info.plist para conferir a versao, .app para trocar de
  # lugar), e caminho_do_bundle devolve None fora do darwin -- quem usa
  # Windows baixa a versao nova do release a mao.
  build-windows:
    needs: [determine-tag, build-app]
    if: needs.determine-tag.outputs.should_release == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ needs.determine-tag.outputs.tag }}
    steps:
      # Sem credenciais gravadas no .git: este job roda codigo do repositorio
      # (npm test, build) tambem no ensaio de PR, e o token do workflow tem
      # `contents: write`. O unico passo que precisa escrever (gh release) recebe
      # o token explicito pelo env, entao nada do que o build executa o enxerga.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # A imagem do runner Windows nao traz ffmpeg, e nao da pra instalar por
      # gerenciador aqui: o chocolatey instala por "shim" -- um lancador que
      # aponta para o caminho real -- e o `shutil.which` da spec acabaria
      # embutindo o lancador no pacote, que na maquina do usuario procuraria
      # um caminho que nao existe. O build estatico do gyan.dev e um .exe
      # sozinho, sem DLL solta e sem indirecao.
      #
      # URL com numero de versao, e nao o "ffmpeg-release-essentials.zip"
      # (que muda de conteudo a cada release do ffmpeg): o build tem que ser
      # reproduzivel. O .sha256 vem do mesmo host, entao prova integridade do
      # download (truncado, corrompido), nao procedencia -- para procedencia
      # so assinatura serviria, e o gyan.dev nao publica uma.
      - name: Install ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          $esperado = (Invoke-WebRequest -Uri "$url.sha256").Content.Trim().ToLower()
          $obtido = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($obtido -ne $esperado) {
            throw "sha256 do ffmpeg nao bate: esperado $esperado, obtido $obtido"
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist
          $bin = (Get-ChildItem ffmpeg-dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1).Directory.FullName
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            shell/package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          uv sync --extra build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Mesma checagem do job do macOS, e pelo mesmo motivo: release
      # anunciando um numero e executavel se identificando com outro.
      #
      # O `if ($LASTEXITCODE ...)` depois de cada comando externo se repete em
      # todo este job porque $ErrorActionPreference nao alcanca binario: sem
      # ele um `uv`/`gh`/`pyinstaller` que falhou deixa o passo VERDE e o
      # release sai com asset faltando ou quebrado.
      - name: Check tag matches __version__
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versao = (uv run python -c "import trackclassifier; print(trackclassifier.__version__)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = $env:TAG -replace '^v', ''
          if ($versao -ne $tag) {
            throw "Tag $env:TAG nao bate com __version__ = $versao"
          }
          $shellVersao = (node -p "require('./shell/package.json').version").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($shellVersao -ne $tag) {
            throw "shell/package.json em $shellVersao, mas a tag e $env:TAG"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "versao=$versao"

      - name: Build the web front
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location web
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist\index.html)) { throw "web/dist/index.html nao foi gerado" }

      - name: Test the shell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location shell
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the backend
        shell: pwsh
        run: |
          uv run pyinstaller packaging/trackclassifier.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack the Electron shell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location shell
          npm run pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path out\win-unpacked\TrackClassifier.exe)) {
            throw "shell/out/win-unpacked/TrackClassifier.exe nao foi gerado"
          }

      # Smoke do artefato empacotado, como no macOS. Start-Process com saida
      # redirecionada porque o .exe do Electron e GUI e nao escreve no console
      # do pwsh; o WaitForExit() sem argumento depois do com prazo e o que faz
      # o ExitCode ficar disponivel.
      - name: Smoke the packed app
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "shell\out\win-unpacked\TrackClassifier.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru `
            -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          if (-not $p.WaitForExit(150000)) {
            $p.Kill()
            throw "smoke estourou 150s"
          }
          $p.WaitForExit()
          Get-Content smoke.out, smoke.err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke saiu com codigo $($p.ExitCode)" }

      # Compress-Archive basta aqui: o problema de symlink que obrigou o
      # macOS a usar ditto e dos frameworks dentro do .app, e a pasta do
      # Windows nao tem symlink nenhum.
      #
      # `-Path staging\TrackClassifier` (sem `\*`) e o que faz a pasta aparecer
      # DENTRO do zip: com o curinga o conteudo sairia solto na raiz e quem
      # descompactasse levaria centenas de arquivos para Downloads/.
      #
      # `${nome}.sha256` com chaves, nunca `$nome.sha256`: sem elas o
      # PowerShell le como acesso a propriedade `.sha256` da string, que nao
      # existe, e o arquivo sairia com nome vazio.
      - name: Zip the folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nome = "TrackClassifier-${env:versao}-windows.zip"
          # O win-unpacked do electron-builder tem outro nome de pasta; copiar
          # para staging\TrackClassifier mantem o layout que o usuario ja
          # conhece (uma pasta TrackClassifier com o .exe dentro).
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item -Recurse shell\out\win-unpacked staging\TrackClassifier
          Compress-Archive -Path staging\TrackClassifier -DestinationPath $nome
          $fixo = "TrackClassifier-latest-windows.zip"
          Copy-Item $nome $fixo
          foreach ($arquivo in @($nome, $fixo)) {
            $hash = (Get-FileHash $arquivo -Algorithm SHA256).Hash.ToLower()
            "$hash  $arquivo" | Out-File -Encoding ascii "${arquivo}.sha256"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "zip=$nome"

      - name: Upload the dry-run artifacts
        if: needs.determine-tag.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-dry-run
          path: |
            ${{ env.zip }}
            ${{ env.zip }}.sha256
          retention-days: 3

      - name: Upload the Windows assets
        if: needs.determine-tag.outputs.dry_run != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release upload $env:TAG `
            $env:zip "${env:zip}.sha256" `
            TrackClassifier-latest-windows.zip TrackClassifier-latest-windows.zip.sha256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

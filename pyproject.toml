[project]
name = "trackclassifier"
version = "0.1.0"
description = "Classificacao automatica de tracks por energia para DJ"
requires-python = ">=3.11,<3.14"
dependencies = [
    "librosa>=0.10.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyloudnorm>=0.1.1",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "threadpoolctl>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "soundfile>=0.12", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
dj = "trackclassifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackclassifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project]
name = "trackclassifier"
dynamic = ["version"]
description = "Classificacao automatica de tracks por energia para DJ"
requires-python = ">=3.11,<3.14"
dependencies = [
    "certifi>=2024.2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "librosa>=0.10.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyloudnorm>=0.1.1",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "joblib>=1.3",
    "threadpoolctl>=3.6",
    "PySide6-Essentials>=6.7",
    "PySide6-Addons>=6.7",
    "mutagen>=1.48.1",
    "send2trash>=1.8",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.28", "soundfile>=0.12", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[project.scripts]
dj = "trackclassifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackclassifier"]

[tool.hatch.version]
path = "src/trackclassifier/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
